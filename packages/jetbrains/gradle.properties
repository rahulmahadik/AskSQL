# AskSQL JetBrains plugin build properties.
# This file governs ONLY packages/jetbrains - it is a standalone Gradle project,
# invisible to the root pnpm workspace (no package.json at packages/jetbrains/).

pluginGroup = com.rahulmahadik.asksql
pluginName = AskSQL
pluginVersion = 0.5.3

# IntelliJ Platform target used to COMPILE and RUN the sandbox. Broad
# compatibility is governed by pluginSinceBuild/pluginUntilBuild in
# build.gradle.kts, not by this version. Resolved via Maven (useInstaller =
# false in build.gradle.kts), which takes the plain marketing version.
platformType = IC
platformVersion = 2024.2

# Verified latest-stable coordinates (2026-07-16) - see build.gradle.kts for
# where each is applied.
kotlinVersion = 2.4.10

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC

# The IntelliJ Platform ships its own Kotlin stdlib/reflect/coroutines at
# runtime; bundling our own copies risks classloader duplication (two
# CoroutineScope classes from two loaders is a silent, hard-to-debug failure
# mode). Compile against them (compileOnly) and never repackage them.
kotlin.stdlib.default.dependency = false
