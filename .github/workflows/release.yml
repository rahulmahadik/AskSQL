name: Release

on:
  push:
    tags:
      # `v*` also matches `vscode-v*` (both start with `v`), so exclude the other
      # surfaces' tag prefixes or an extension release would also publish npm.
      - 'v*'
      - '!vscode-v*'
      - '!jetbrains-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # create the GitHub Release for this tag
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release tag is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} (${{ github.sha }}) is not on main; refusing to publish."
            exit 1
          fi
          echo "Release tag ${{ github.ref_name }} is on main; proceeding."
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Release notes from the annotated tag
        id: notes
        run: |
          # The tag message is written when the release is cut and is the most accurate
          # description of it; without a body the release is published empty.
          git fetch --force --tags --quiet
          {
            echo 'body<<ASKSQL_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'ASKSQL_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
